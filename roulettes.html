<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #12121a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .wheel-container { position: relative; width: 280px; height: 280px; margin-bottom: 20px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.25, 0.1, 0.1, 1); box-shadow: 0 0 20px rgba(255,165,2,0.3); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ffa502; z-index: 10; }
        .controls { display: flex; gap: 10px; }
        .btn { background: #ffa502; color: black; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #444; color: #888; pointer-events: none; }
        #status { margin-top: 15px; font-weight: bold; color: #2ed573; height: 20px; }
    </style>
</head>
<body>
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div id="status">Выберите ставку</div>
    <div class="controls">
        <button class="btn" id="btn15" onclick="requestSpin(15, 10)">15 ⭐</button>
        <button class="btn" id="btn25" onclick="requestSpin(25, 4)">25 ⭐</button>
        <button class="btn" id="btn50" onclick="requestSpin(50, 2)">50 ⭐</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0, isSpinning = false;

        function drawWheel(sectors) {
            const cx = canvas.width/2, cy = canvas.height/2, r = canvas.width/2;
            const arc = (Math.PI * 2) / sectors;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < sectors; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#2ed573' : '#ff4757';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, i * arc, (i + 1) * arc);
                ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(i * arc + arc/2);
                ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif";
                ctx.fillText((i % 2 === 0) ? "ПОБЕДА" : "ПРОИГРЫШ", r - 20, 8);
                ctx.restore();
            }
        }

        function requestSpin(bet, sectors) {
            if (isSpinning) return;
            tg.sendData(JSON.stringify({ action: "check_balance", bet: bet, sectors: sectors }));
        }

        // Эту функцию вызывает бот после проверки баланса
        function startSpin(bet, sectors, isWin) {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('status').innerText = "Крутим...";
            drawWheel(sectors);
            
            const winSector = isWin ? 0 : 1; // 0 - Победа, 1 - Проигрыш
            const arc = 360 / sectors;
            const targetAngle = 360 * 5 + (270 - (winSector * arc + arc / 2));
            
            currentAngle += targetAngle;
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            setTimeout(() => {
                document.getElementById('status').innerText = isWin ? `ПОБЕДА! +${bet*2} ⭐` : `ПРОИГРЫШ -${bet} ⭐`;
                document.getElementById('status').style.color = isWin ? '#2ed573' : '#ff4757';
                isSpinning = false;
            }, 4000);
        }
    </script>
</body>
</html>
